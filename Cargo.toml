[package]
name = "opt_bt"
version = "0.1.0"
edition = "2021"
authors = ["Amol-Gupta"]
description = "High-performance options backtesting engine"

[lib]
name = "opt_bt"
path = "src/lib.rs"

[[bin]]
name = "opt_bt"
path = "src/main.rs"

[dependencies]
# Logging (Low Latency)
ftlog = "0.2"
log = "0.4"


# Data Handling
polars = { version = "0.36", default-features = false, features = ["parquet", "lazy", "serde", "dtype-date", "dtype-datetime", "dtype-decimal", "timezones"] }

# CLI & Config
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rkyv = { version = "0.8", features = ["std", "bytecheck", "pointer_width_64"] }
toml = "0.8"

# Time & Date
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
rayon = "1.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Pinned dependencies to avoid edition2024 / new rustc requirements
home = "=0.5.9"
time = "=0.3.36"
indexmap = "=2.2.6"
rand = { version = "0.9.2", features = ["std_rng"] }
itertools = "0.14.0"
sha2 = "0.10"
# comfy-table = "=7.1.3" # implied by polars fmt, but we disabled defaults

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[profile.release]
debug = true
lto = "thin"
rand = "0.8"
